<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Horse club management workspace" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-fivegates.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TMEC" />
    <link rel="apple-touch-icon" href="/images/logo-fivegates.png" />
    <title>TMEC</title>
    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "8151c6d9-40f9-47f8-8d44-6b93a4891c3f",
        });
      });
    </script>
    <!-- Set theme trước khi vẽ trang để không chớp trắng; logic khớp src/shared/lib/theme.ts -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("equiflow-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
